[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcg-mtad"
version = "0.1.0"
description = "End-to-end road-conditioned multimodal tire anomaly detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pillow>=10,<13",
  "timm>=1.0.8,<1.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
train-road-encoder = "tire_anomaly_system.cli.train_road_encoder:main"
train-rcg-mtad = "tire_anomaly_system.cli.train_model:main"
infer-rcg-mtad = "tire_anomaly_system.cli.infer_model:main"
train-tire-classifier = "tire_anomaly_system.cli.train_model:main"
infer-tire-classifier = "tire_anomaly_system.cli.infer_model:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
